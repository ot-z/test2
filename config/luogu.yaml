# =============================================================================
# 洛谷公开题面采集配置（v1.2 / FR-30）
# -----------------------------------------------------------------------------
# 适用范围（用户于 2026-11-07 明确要求开放）：
#   - 只访问洛谷**公开题目页自带的 lentille-context JSON**（浏览器打开页面就能看到的内容）；
#   - 只保存题面/样例/数据范围，不保存题解、讨论区、用户代码等其它内容；
#   - 不登录、不复用用户 Cookie、不处理验证码 / JS 挑战、不抓需权限的题目；
#     站点 CDN 自动下发的匿名访问 cookie 由 HTTP 客户端按浏览器常规行为自动保存；
#   - 默认限速 >= 1.2 秒/请求，失败退避、可中断、可断点续跑；
#   - 题面仅本地个人学习使用，不参与任何导出产物，请勿二次分发。
#
# 站点页面结构变动时，优先改这里；只有 JSON 结构改版才需要改 app/services/luogu.py。
# =============================================================================

version: 1

site:
  problem_url: "https://www.luogu.com.cn/problem/{pid}"
  tags_url: "https://www.luogu.com.cn/_lfe/tags"
  config_url: "https://www.luogu.com.cn/_lfe/config"
  list_url: "https://www.luogu.com.cn/problem/list?type=P&page={page}"
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

crawl:
  request_interval_seconds: 1.2     # 两次外部请求之间的最小间隔（礼貌限速）
  timeout_seconds: 20
  challenge_retries: 4              # CDN 匿名 cookie 挑战允许的最大重复请求次数
  max_retries: 3                   # 网络错误 / 5xx 的重试次数
  retry_backoff_seconds: 4         # 重试基础退避，按次数线性增长
  max_consecutive_missing: 120     # 连续多少个题号不存在，判定「已到题库末尾」
  max_consecutive_errors: 6        # 连续多少次请求失败即中止整批，避免持续打扰站点
  state_flush_every: 10            # 每处理多少题持久化一次进度

# 洛谷 difficulty 数值 → 项目 5 档难度。
# 名称以站点 /_lfe/config 的 ProblemDifficulty 为准（当前 0..8 共 9 档），
# 采集时会自动同步并缓存到 data/luogu_difficulty.json；这里的 name 仅作离线兜底。
# 原始数值始终写进 difficulty_raw，站点改版也不会丢信息。
difficulty:
  0: {name: "暂无评定", level: 3}
  1: {name: "入门", level: 1}
  2: {name: "普及−", level: 2}
  3: {name: "普及", level: 2}
  4: {name: "普及+/提高−", level: 3}
  5: {name: "提高", level: 3}
  6: {name: "提高+/省选−", level: 4}
  7: {name: "省选/NOI−", level: 5}
  8: {name: "NOI/NOI+/CTS", level: 5}

# 标签类型（/_lfe/tags 的 types）：只有 Algorithm=2 / Others=6 参与知识点归一，
# 来源(3)、年份(4)、地区(1)、特殊题目(5) 仅存入 external_tags 作为检索标签。
knowledge_tag_types: [2, 6]
# type=6 里这些是分类占位符，不是具体知识点
ignore_tags: ["算法", "数据结构", "来源", "时间", "高级数据结构", "地区", "特殊题目", "其它技巧", "Ad-hoc", "基础算法"]

